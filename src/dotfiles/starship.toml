"$schema" = "https://starship.rs/config-schema.json"

# ─── Noctalia Palette (Refined Monochrome) ─────────
palette = "noctalia"
command_timeout = 2000
scan_timeout = 30
add_newline = false

# Two-line prompt with rounded powerline separators
format = """
[┌─](fg:accent)$username$sudo$hostname$directory$status$jobs$cmd_duration$fill
[└─](fg:dim)$character"""

right_format = "$time"
continuation_prompt = "[└─](fg:dim)"

[fill]
symbol = "─"
style = "fg:dim"

# ─── Palette: Noctalia ─────────────────────────────
[palettes.noctalia]
# Core grays — stepped contrast
bright    = "#e8e8e8"
mid       = "#9a9a9a"
dim       = "#4a4a4a"
accent    = "#ffffff"

# Surface blacks — depth layers
base      = "#0a0a0a"
surface0  = "#0d0d0d"
surface1  = "#141414"
surface2  = "#1a1a1a"
mantle    = "#0d0d0d"
crust     = "#0a0a0a"

# Semantic aliases (mapped to grays)
blue      = "#b8b8b8"
red       = "#ffffff"
green     = "#d0d0d0"
yellow    = "#b8b8b8"
cyan      = "#d0d0d0"
magenta   = "#ffffff"
white     = "#9a9a9a"
black     = "#141414"
rosewater = "#b8b8b8"
flamingo  = "#ffffff"
pink      = "#ffffff"
mauve     = "#ffffff"
maroon    = "#ffffff"
peach     = "#b8b8b8"
teal      = "#d0d0d0"
sky       = "#d0d0d0"
sapphire  = "#b8b8b8"
lavender  = "#ffffff"
text      = "#9a9a9a"
subtext1  = "#9a9a9a"
subtext0  = "#4a4a4a"
overlay2  = "#4a4a4a"
overlay1  = "#4a4a4a"
overlay0  = "#141414"

# ─── Username ──────────────────────────────────────
[username]
show_always = true
format = "[](fg:dim)[󰣇 $user]($style)[▸](fg:dim) "
style_user = "fg:bright bold"
style_root = "fg:accent bold"

# ─── Hostname (SSH only) ───────────────────────────
[hostname]
ssh_only = true
format = "[](fg:dim)[$ssh_symbol$hostname]($style)[▸](fg:dim) "
ssh_symbol = "@"
style = "fg:mid"

# ─── Sudo Cache ────────────────────────────────────
[sudo]
disabled = false
format = "[](fg:dim)[sudo]($style)[▸](fg:dim) "
style = "fg:accent bold"

# ─── Directory ─────────────────────────────────────
[directory]
format = "[](fg:dim)[󰉋 $path]($style)[$read_only]($read_only_style)[▸](fg:dim) "
style = "fg:bright bold"
truncation_length = 3
truncation_symbol = "…/"
truncate_to_repo = true
read_only = "🔒"
read_only_style = "fg:accent"
home_symbol = "~"

# ─── Git Branch ────────────────────────────────────
[git_branch]
format = "[](fg:dim)[󰁹 $branch]($style)[▸](fg:dim) "
style = "fg:mid"
symbol = ""

# ─── Git State (rebase/merge/cherry-pick) ──────────
[git_state]
format = "[](fg:dim)[$state]($style)[▸](fg:dim) "
style = "fg:accent bold"

# ─── Git Status ────────────────────────────────────
[git_status]
format = "[](fg:dim)[$all_status$ahead_behind]($style)[▸](fg:dim) "
style = "fg:accent"
conflicted = "✖"
ahead = "↑"
behind = "↓"
diverged = "↕"
untracked = "?"
stashed = "≡"
modified = "✎"
staged = "+"
deleted = "−"
renamed = "→"
typechanged = "~"

# ─── Exit Code ─────────────────────────────────────
[status]
disabled = false
format = "[](fg:dim)[$symbol]($style)[▸](fg:dim) "
symbol = "✗"
success_symbol = ""
style = "fg:accent bold"

# ─── Background Jobs ───────────────────────────────
[jobs]
format = "[](fg:dim)[⚙ $number]($style)[▸](fg:dim) "
symbol = ""
style = "fg:mid"
symbol_threshold = 1
number_threshold = 2

# ─── Runtime Versions ──────────────────────────────
[nodejs]
format = "[](fg:dim)[⬢ $version]($style)[▸](fg:dim) "
style = "fg:mid"
symbol = ""
version_format = "v${major}"

[python]
disabled = true
format = '[󰣇 ($virtualenv) ]($style)[▸](fg:dim) '
style = "fg:mid"
symbol = ""
version_format = "${major}.${minor}"

[rust]
format = "[](fg:dim)[🦀 $version]($style)[▸](fg:dim) "
style = "fg:mid"
symbol = ""
version_format = "v${major}.${minor}"

[golang]
format = "[](fg:dim)[🐹 $version]($style)[▸](fg:dim) "
style = "fg:mid"
symbol = ""
version_format = "${major}.${minor}"

# Disabled by default — enable per-project via starship.toml in repo
[c]
disabled = true
[cpp]
disabled = true
[java]
disabled = true
[ruby]
disabled = true
[php]
disabled = true

# ─── Environment Context ───────────────────────────
[conda]
disabled = true
format = "[](fg:dim)[🅒 $environment]($style)[▸](fg:dim) "
style = "fg:mid"
symbol = ""

[nix_shell]
format = "[](fg:dim)[❄ $state]($style)[▸](fg:dim) "
style = "fg:mid"
symbol = ""

[direnv]
disabled = false
format = "[](fg:dim)[⎇]($style)[▸](fg:dim) "
style = "fg:mid"
symbol = ""

[docker_context]
format = "[](fg:dim)[🐳 $context]($style)[▸](fg:dim) "
style = "fg:mid"
symbol = ""

[container]
format = "[](fg:dim)[📦 $name]($style)[▸](fg:dim) "
style = "fg:accent"
symbol = ""

[kubernetes]
disabled = true
format = "[](fg:dim)[☸ $context]($style)[▸](fg:dim) "
style = "fg:mid"
symbol = ""

[aws]
disabled = true
[gcloud]
disabled = true
[azure]
disabled = true

# ─── Battery ───────────────────────────────────────
[battery]
disabled = false
format = "[](fg:dim)[$symbol$percentage]($style)[▸](fg:dim) "
full_symbol = "󰁹"
charging_symbol = "󰂄"
discharging_symbol = "󰁿"
unknown_symbol = "󰂑"
empty_symbol = "󰂃"

[[battery.display]]
threshold = 15
style = "fg:accent bold"

# ─── Command Duration ──────────────────────────────
[cmd_duration]
min_time = 2000
format = "[](fg:dim)[⏱ $duration]($style)[▸](fg:dim) "
style = "fg:dim"
symbol = ""
show_notifications = true
min_time_to_notify = 30000

# ─── Time (Right Side) ─────────────────────────────
[time]
disabled = false
format = "[󱎫 $time]($style)"
style = "fg:dim"
time_format = "%H:%M"
time_range = "-"

# ─── Prompt Character ──────────────────────────────
[character]
format = "$symbol "
success_symbol = "0x❯"
error_symbol = "0x✗"
vicmd_symbol = "0x❮"
style_success = "fg:bright bold"
style_failure = "fg:accent bold"
style_vimcmd = "fg:mid bold"

# ─── Disabled Modules ──────────────────────────────
[localip]
disabled = true

# ─── Custom: Arch Distro ───────────────────────────
[custom.arch]
command = "cat /etc/os-release 2>/dev/null | grep -oP '(?<=^ID=).*' | head -1"
when = "test -f /etc/os-release"
format = "[](fg:dim)[🏗]($style)[▸](fg:dim) "
style = "fg:dim"
symbol = ""
description = "Shows distro ID on Arch-based systems"